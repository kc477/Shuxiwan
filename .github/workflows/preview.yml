name: Preview Tunnel

# Spins up the Next.js dev server on a GitHub Actions runner, exposes it via
# a Cloudflare quick tunnel, and writes the public URL back to .preview-url
# on this branch via the Contents API. Free runners have full outbound
# internet, which is what the agent's host sandbox does not.

on:
  push:
    branches: [claude/community-platform-design-PbLkS]
    paths-ignore: [".preview-url", ".github/workflows/preview.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "file:./dev.db"

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write .env (some tools read this directly)
        run: echo 'DATABASE_URL="file:./dev.db"' > .env

      - name: Install deps
        run: |
          set -e
          npm install --no-audit --no-fund

      - name: Push schema and seed
        run: |
          set -e
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Start Next.js dev server in background
        run: |
          set -x
          # Detach with setsid so the process survives the step boundary.
          setsid bash -c 'exec npm run dev' > dev-server.log 2>&1 < /dev/null &
          echo $! > server.pid
          echo "Waiting for server on :3000..."
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "Server ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Dev server did not become ready"
          echo "--- dev-server.log tail ---"
          tail -80 dev-server.log
          exit 1

      - name: Install cloudflared
        run: |
          curl -L -sS --fail -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared --version

      - name: Start cloudflared tunnel and capture public URL
        id: tunnel
        run: |
          set -x
          setsid bash -c './cloudflared tunnel --no-autoupdate --url http://localhost:3000' \
            > tunnel.log 2>&1 < /dev/null &
          echo $! > tunnel.pid
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "::error::Tunnel URL not obtained"
            tail -80 tunnel.log
            exit 1
          fi
          echo "URL=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Preview ready::$URL"

      - name: Persist URL via Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.tunnel.outputs.URL }}
          BR: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          BODY=$(printf '%s\n\nstarted: %s\nrun: %s\n' \
            "$URL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RUN_URL")
          B64=$(printf '%s' "$BODY" | base64 -w 0)

          SHA=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/contents/.preview-url?ref=$BR" \
            | jq -r '.sha // empty')

          if [ -n "$SHA" ]; then
            PAYLOAD=$(jq -nc --arg m "chore: update preview URL [skip ci]" \
              --arg c "$B64" --arg b "$BR" --arg s "$SHA" \
              '{message:$m, content:$c, branch:$b, sha:$s}')
          else
            PAYLOAD=$(jq -nc --arg m "chore: add preview URL [skip ci]" \
              --arg c "$B64" --arg b "$BR" \
              '{message:$m, content:$c, branch:$b}')
          fi

          RESP=$(curl -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/$REPO/contents/.preview-url")
          echo "$RESP" | jq '{commit: .commit.sha, content_sha: .content.sha, message: .message}' || echo "$RESP"

      - name: Heartbeat (keep tunnel alive until job timeout)
        env:
          URL: ${{ steps.tunnel.outputs.URL }}
        run: |
          while sleep 60; do
            if curl -sf -o /dev/null --max-time 10 "$URL/"; then
              echo "$(date -u) ok"
            else
              echo "$(date -u) WARN health check failed"
            fi
          done
